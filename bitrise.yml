# HAo Live — Bitrise workflow
#
# Unsigned simulator build (primary, compile check) + device IPA packaging
# (ipa, Release, unsigned — sideload with LCSign/TrollStore). Branch: master.
# Stack: Xcode 26.2.
format_version: '13'
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: ios
trigger_map: []
workflows:
  primary:
    meta:
      bitrise.io:
        stack: osx-xcode-26.2.x
    steps:
    - activate-ssh-key@4:
        run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
    - git-clone@8: {}
    - script@1:
        title: Build for simulator (unsigned)
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -e
            xcodebuild -project HAoLive.xcodeproj \
              -target HAoLive \
              -configuration Debug \
              -sdk iphonesimulator \
              -destination 'generic/platform=iOS Simulator' \
              CODE_SIGNING_ALLOWED=NO \
              build
  ipa:
    meta:
      bitrise.io:
        stack: osx-xcode-26.2.x
    steps:
    - activate-ssh-key@4:
        run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
    - git-clone@8: {}
    - script@1:
        title: Build unsigned app (device, Release)
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -e
            # -scheme needs the shared scheme committed at
            # HAoLive.xcodeproj/xcshareddata/xcschemes/HAoLive.xcscheme;
            # -derivedDataPath requires -scheme.
            xcodebuild -project HAoLive.xcodeproj \
              -scheme HAoLive \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO
    - script@1:
        title: Package IPA
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -e
            APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
            test -n "$APP_PATH" || { echo "HAoLive.app not found under build/Build/Products/Release-iphoneos"; exit 1; }
            echo "App: $APP_PATH"
            rm -rf Payload HAoLive.ipa
            mkdir -p Payload
            cp -r "$APP_PATH" Payload/
            # package_ipa.py writes Info.plist third, plain deflate, no
            # extra fields, no data descriptors — LCSign's shallow scan
            # needs the main bundle up front (see its header comment).
            python3 package_ipa.py Payload HAoLive.ipa
            ls -lh HAoLive.ipa
            mkdir -p "$BITRISE_DEPLOY_DIR"
            # Deploy-to-Bitrise parses *.ipa for a provisioning profile
            # and fails on unsigned builds (no embedded.mobileprovision).
            # Ship the same bytes as a .zip — an IPA is a zip — so it
            # uploads as a generic file; rename back to .ipa after download.
            cp HAoLive.ipa "$BITRISE_DEPLOY_DIR/HAoLive-v0.1.0.zip"
            ls -lh "$BITRISE_DEPLOY_DIR/"
    - deploy-to-bitrise-io@2: {}
